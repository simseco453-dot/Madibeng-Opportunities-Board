name: Refresh listings

on:
  schedule:
    - cron: "0 3,15 * * *"   # 05:00 and 17:00 South African time
  workflow_dispatch:
  pull_request:              # on a PR: tests + a dry run, nothing written

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collectors/requirements.txt
      - run: pip install -r collectors/requirements.txt
      - name: Offline tests
        run: python -m unittest discover collectors/tests -v
      - name: Dry run (pull requests)
        if: github.event_name == 'pull_request'
        run: python collectors/run_all.py --dry-run
      - name: Collect
        if: github.event_name != 'pull_request'
        env:
          SUBMISSIONS_CSV_URL: ${{ vars.SUBMISSIONS_CSV_URL }}
        run: python collectors/run_all.py
      - name: Commit new data
        id: commit
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "madibeng-board-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Refresh listings $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
